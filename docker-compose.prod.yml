services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pontoproof}
      POSTGRES_USER: ${POSTGRES_USER:-pontoproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pontoproof_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pontoproof}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pontoproof}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pontoproof}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: 3333
      WEB_ORIGIN: ${WEB_ORIGIN}
      BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY}
      BIOMETRIC_STORAGE_DIR: /data/biometrics
      AUDIT_PRIVACY_HASH_KEY: ${AUDIT_PRIVACY_HASH_KEY}
      PRESENCE_SIGNING_SECRET: ${PRESENCE_SIGNING_SECRET}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-PontoProof}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
      BIOMETRIC_NOTICE_VERSION: ${BIOMETRIC_NOTICE_VERSION:-2026-09-v1}
    volumes:
      - pontoproof_biometrics:/data/biometrics
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
        VITE_NETWORK_ATTEST_URL: ${VITE_NETWORK_ATTEST_URL:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pontoproof_pg:
  pontoproof_biometrics:
